apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-server
  namespace: ax-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # With --auth, ax-server verifies each caller's token with a TokenReview
  # and checks each RPC with a SubjectAccessReview.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ax-server
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ax-server
---
# Example roles for AX users. ax-server checks each RPC as a verb on a
# resource in API group ax.io (tasks, workspaces, models), with the atespace
# as the namespace. These resources are not in the Kubernetes API; only
# ax-server reads these rules. Bind a role with a RoleBinding in a namespace
# with the name of the atespace, or with a ClusterRoleBinding for all
# atespaces. A list with no atespace (ax get without -a) needs a
# ClusterRoleBinding. For example:
#
#   kubectl create namespace team-a
#   kubectl create rolebinding alice-ax-editor -n team-a \
#     --clusterrole=ax-editor --user=alice@example.com
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-viewer
rules:
  - apiGroups: ["ax.io"]
    resources: ["tasks", "workspaces", "models"]
    verbs: ["get", "list", "watch"]
---
# ax-editor can also create, suspend, resume (update), and delete tasks, and
# write workspaces and models. A task runs on Substrate with ax-server's
# credentials and spends the budget of its atespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-editor
rules:
  - apiGroups: ["ax.io"]
    resources: ["tasks"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["ax.io"]
    resources: ["workspaces", "models"]
    verbs: ["get", "list", "watch", "update", "delete"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      serviceAccountName: ax-server
      containers:
        - name: ax-server
          image: ko://github.com/google/ax/cmd/ax-server
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--redis-addr=ax-redis.ax-system.svc.cluster.local:6379"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=ax-system"
            # Verify each caller with a Kubernetes TokenReview and check each
            # RPC against the ax.io RBAC rules above. /healthz stays open.
            - "--auth=true"
            # The ax CLI sends the credential of the user's kubeconfig. On
            # GKE that token is for the API server's own audience, not for
            # ax-server, so ax-server must accept it. Such a token also works
            # against the Kubernetes API. Set this to false when all callers
            # send a token for the ax-server audience, for example from
            # "kubectl create token --audience=ax-server".
            - "--auth-allow-apiserver-tokens=true"
          env:
            - name: ATENET_ROUTER_ADDR
              value: "atenet-router.ate-system.svc.cluster.local:80"
            - name: AX_SNAPSHOTS_BUCKET
              value: "gs://dberkov-gke-dev3/ate-env/"
            # Send task lifecycle events (ax.task.state_changed: parent,
            # budget, phase, outcome) to Agent FinOps through its
            # OpenTelemetry Collector. ax-server sends no events when no
            # OTLP endpoint is set. ax-server also sends the state of every
            # task again every --task-resync-interval (default 10m).
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://finops-collector.ate-finops.svc:4317"
            # - name: OTEL_EXPORTER_OTLP_INSECURE
            #   value: "true"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ax-server

